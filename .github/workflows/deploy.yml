name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Astro's prerender hangs under Bun, so build and deploy with Node.
      - run: node node_modules/astro/bin/astro.mjs build

      # migrations/<database name>/ for each D1 database in wrangler.jsonc
      - name: Apply D1 migrations
        if: hashFiles('migrations/**/*.sql') != ''
        run: |
          for dir in migrations/*/; do
            node node_modules/wrangler/bin/wrangler.js d1 migrations apply "$(basename "$dir")" --remote
          done

      - run: node node_modules/wrangler/bin/wrangler.js deploy
